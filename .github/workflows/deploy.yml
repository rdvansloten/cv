name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token plus the OIDC + pages scopes deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push supersede an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Built in a pinned container rather than on the runner directly, so the
      # exact same image produces the PDF here and on a developer machine.
      # Chromium's PDF text layout depends on the host (glyph hinting differs
      # between Linux and macOS), and it is not otherwise checkable locally.
      # Same entrypoint as `scripts/ci_docker.sh` run by hand.
      - name: Generate and verify cv.pdf
        run: scripts/ci_docker.sh

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html content.md cv.pdf .nojekyll css js assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
